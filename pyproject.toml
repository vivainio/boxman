[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxman"
version = "0.1.0"
description = "Set up and manage a Linux development box"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
boxman = "boxman.cli:main"

[tool.setuptools.package-data]
boxman = ["data/*.toml"]
