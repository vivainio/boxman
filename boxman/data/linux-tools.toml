# zipget recipe for boxman on Ubuntu 24.04

[system_packages]
apt = [
  "acl", "build-essential", "ca-certificates", "curl", "dbus-user-session",
  "direnv", "file", "fuse3", "fuse-overlayfs", "gh", "git", "git-lfs",
  "gocryptfs", "jq",
  "less", "lf", "libsecret-tools", "openssh-client", "podman", "python3",
  "python3-venv", "python-is-python3", "rsync", "shellcheck",
  "slirp4netns", "uidmap", "unzip", "xz-utils", "zip", "zstd",
]

[vars]
bin_dir = "~/.local/bin"

[herdr]
# Agent multiplexer - https://herdr.dev
github = { repo = "herdrdev/herdr", asset = "herdr-linux-x86_64" }
save_as = "${bin_dir}/herdr"
executable = true

[cship]
# Claude Code statusline - https://cship.dev
github = { repo = "stephenleo/cship", asset = "cship-x86_64-unknown-linux-musl" }
save_as = "${bin_dir}/cship"
executable = true

[microsoft-edit]
# Terminal-based text editor - https://github.com/microsoft/edit
# Note: only gnu builds available (no musl)
github = { repo = "microsoft/edit", asset = "x86_64-linux-gnu.tar.gz" }
unzip_to = "${bin_dir}"
files = "edit"

[starship]
# Cross-shell prompt - https://github.com/starship/starship
github = { repo = "starship/starship", asset = "x86_64-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "starship"

[ripgrep]
# Fast regex search tool - https://github.com/BurntSushi/ripgrep
github = { repo = "BurntSushi/ripgrep", asset = "x86_64-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "*/rg"

[fd]
# Fast find alternative - https://github.com/sharkdp/fd
github = { repo = "sharkdp/fd", asset = "x86_64-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "*/fd"

[bat]
# Cat with syntax highlighting - https://github.com/sharkdp/bat
github = { repo = "sharkdp/bat", asset = "x86_64-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "*/bat"

[fzf]
# Fuzzy finder - https://github.com/junegunn/fzf
github = { repo = "junegunn/fzf", asset = "linux_amd64.tar.gz" }
unzip_to = "${bin_dir}"
files = "fzf"

[zoxide]
# Smarter cd command - https://github.com/ajeetdsouza/zoxide
github = { repo = "ajeetdsouza/zoxide", asset = "x86_64-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "zoxide"

[delta]
# Git diff viewer - https://github.com/dandavison/delta
github = { repo = "dandavison/delta", asset = "x86_64-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "*/delta"

[aws-cli]
# AWS CLI v2 - official installer
url = "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
unzip_to = "./aws-cli-installer"
